name: Checks

on: [push, pull_request]

jobs:

  Job:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: OS packets
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            echo "deb https://mediaarea.net/repo/deb/ubuntu $(lsb_release --codename --short)-snapshots main" | sudo tee /etc/apt/sources.list.d/mediaarea-snapshots.list
            sudo curl https://repo.mediaarea.net/deb/ubuntu/keyring.gpg -o /etc/apt/trusted.gpg.d/mediaarea-snapshots.gpg
            sudo apt-get update
            sudo apt-get install -y nasm valgrind mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
            if grep -qw avx512f /proc/cpuinfo; then
              sudo apt-get install -y ffmpeg-ma # Latest snapshot
            else
              # FFmpeg 9.0.1, the 20260927 and 20261004 snapshots crash in the ffv1_vulkan encoder with llvmpipe on CPUs without AVX-512
              curl -fO https://mediaarea.net/download/binary/ffmpeg/9.0.1/ffmpeg-ma_9.0.1-1_amd64.Ubuntu_$(lsb_release --release --short).deb
              sudo apt-get install -y ./ffmpeg-ma_9.0.1-1_amd64.Ubuntu_$(lsb_release --release --short).deb
            fi
          fi
          if [ "$RUNNER_OS" == "macOS" ]; then
            # Warnings of Homebrew about formulae of the runner image (migrations, cleanup) in the log but not as annotations
            StopToken=$(uuidgen)
            echo "::stop-commands::${StopToken}"
            brew update
            brew install coreutils automake mesa vulkan-loader vulkan-tools
            echo "::${StopToken}::"
          fi
      - name: FFmpeg
        run: |
          cd Project/GNU/CLI
          if [ "$RUNNER_OS" == "Linux" ]; then
            cp /usr/bin/ffmpeg-ma ffmpeg # rawcooked loads the libraries of the ffmpeg-ma package installed above
            ./ffmpeg -hide_banner -version | sed -n 1p
          fi
          if [ "$RUNNER_OS" == "macOS" ]; then
            if [ "$(sysctl -n hw.optional.avx512f 2>/dev/null)" == "1" ]; then
              Base=https://mediaarea.net/download/snapshots/binary/ffmpeg/latest Version=Latest # Latest snapshot
            else
              # FFmpeg 9.0.1, the 20260927 and 20261004 snapshots crash in the ffv1_vulkan encoder with llvmpipe on CPUs without AVX-512 (e.g. Apple silicon)
              Base=https://mediaarea.net/download/binary/ffmpeg/9.0.1 Version=9.0.1
            fi
            # Shared build in the ffmpeg directory next to rawcooked, which loads its libraries (ffmpeg/lib), its ffmpeg is used by the tests
            curl -fsSL -o FFmpeg.zip ${Base}/FFmpeg_Bin_${Version}_Mac_Shared_universal.zip
            7za x -y -offmpeg FFmpeg.zip > /dev/null
            echo "${PWD}/ffmpeg/bin" >> "${GITHUB_PATH}"
            rm FFmpeg.zip
            # Libraries refer to each other with @executable_path/../lib, which is their directory for ffmpeg/bin/ffmpeg but not for rawcooked:
            # @loader_path/../lib instead, same directory for both (signed again after the change)
            for Lib in ffmpeg/lib/*.dylib ; do
              for Dep in $(otool -L "${Lib}" | sed -n 's|^[[:space:]]*@executable_path/\.\./lib/\([^ ]*\) .*|\1|p' | sort -u) ; do
                install_name_tool -change "@executable_path/../lib/${Dep}" "@loader_path/../lib/${Dep}" "${Lib}"
              done
              codesign --force --sign - "${Lib}"
            done
            ffmpeg/bin/ffmpeg -hide_banner -version | sed -n 1p
          fi
      - name: Vulkan
        if: runner.os == 'macOS'
        run: |
          # lavapipe, a CPU implementation of Vulkan (Mesa), as on Linux and Windows (no GPU in the runner, so no KosmicKrisp)
          Driver=$(find "$(brew --prefix mesa)/share/vulkan/icd.d" -name 'lvp_icd*.json' -print -quit)
          echo "lavapipe: ${Driver:-not found}"
          test -n "${Driver}"
          echo "VK_DRIVER_FILES=${Driver}" >> "${GITHUB_ENV}"
          VK_DRIVER_FILES="${Driver}" vulkaninfo --summary || true
      - name: Configure
        run: |
          cd Project/GNU/CLI
          sh autogen.sh
          ./configure # FFmpeg libraries loaded at run time (--with-ffmpeg=dynamic by default)
      - name: Compile
        run: |
          cd Project/GNU/CLI
          make
      - name: Check files
        run: |
          cd Project/GNU/CLI
          make clone_testing_files
      - name: Check
        run: |
          cd Project/GNU/CLI
          make check

  Windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings
        run: git config --global core.autocrlf false # Test scripts with LF line endings
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: FFmpeg
        run: |
          cd Project/GNU/CLI
          if grep -qw avx512f /proc/cpuinfo; then
            Base=https://mediaarea.net/download/snapshots/binary/ffmpeg/latest Version=Latest # Latest snapshot
          else
            # FFmpeg 9.0.1, the 20260927 and 20261004 snapshots crash in the ffv1_vulkan encoder with llvmpipe on CPUs without AVX-512
            Base=https://mediaarea.net/download/binary/ffmpeg/9.0.1 Version=9.0.1
          fi
          # Shared build in the ffmpeg directory next to rawcooked, which loads its libraries (ffmpeg\bin), its ffmpeg is used by the tests
          curl -fsSL -o FFmpeg.zip ${Base}/FFmpeg_Bin_${Version}_Windows_Shared_x64.zip
          7z x -y -offmpeg FFmpeg.zip > /dev/null
          cygpath -w "${PWD}/ffmpeg/bin" >> "${GITHUB_PATH}"
          rm FFmpeg.zip
          ffmpeg/bin/ffmpeg -hide_banner -version | sed -n 1p
      - name: Vulkan
        run: |
          # Vulkan loader and vulkaninfo, next to rawcooked (also the loader next to ffmpeg)
          curl -fsSL -o VulkanRT.zip "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip?u="
          7z x -y -oVulkanRT VulkanRT.zip > /dev/null
          for File in vulkan-1.dll vulkaninfo.exe ; do
            Path=$(find VulkanRT -ipath "*x64*/${File}" -print -quit)
            [ -n "${Path}" ] || Path=$(find VulkanRT -iname "${File}" -print -quit)
            echo "${File}: ${Path:-not found}"
            [ -z "${Path}" ] || cp "${Path}" Project/GNU/CLI/
          done
          test -f Project/GNU/CLI/vulkan-1.dll # vulkaninfo is optional
          cp Project/GNU/CLI/vulkan-1.dll Project/GNU/CLI/ffmpeg/bin/
          # lavapipe, a CPU implementation of Vulkan (Mesa), registered because the Vulkan loader ignores VK_DRIVER_FILES in an elevated process (runner)
          curl -fsSL -o Mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
          7z x -y -oMesa Mesa.7z > /dev/null
          Driver=$(find "${PWD}/Mesa" -ipath '*x64*' -iname 'lvp_icd*.json' -print -quit)
          echo "lavapipe: ${Driver:-not found}"
          test -n "${Driver}"
          MSYS_NO_PATHCONV=1 reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$(cygpath -w "${Driver}")" /t REG_DWORD /d 0 /f
          cd Project/GNU/CLI
          ./vulkaninfo --summary || true
      - name: Compile
        run: |
          MSBuild.exe Project/MSVC2026/RAWcooked.slnx -p:Configuration=Release -p:Platform=x64 -m
          cp Project/MSVC2026/x64/Release/RAWcooked_CLI.exe Project/GNU/CLI/rawcooked.exe
      - name: Check files
        run: |
          cd Project/GNU/CLI
          git clone --depth=1 https://github.com/MediaArea/RAWCooked-RegressionTestingFiles-Light.git test/TestingFiles
      - name: Check
        run: |
          cd Project/GNU/CLI
          # Tests of make check (no make in Git Bash), 77 is the exit code of a skipped test
          Status=0
          for Test in $(sed -n 's/^TESTS = //p' Makefile.am) ; do
            Result=0
            bash ${Test} 9>&1 || Result=${?}
            case ${Result} in
              0) echo "PASS: ${Test}" ;;
              77) echo "SKIP: ${Test}" ;;
              *) echo "FAIL: ${Test} (exit code ${Result})" ; Status=1 ;;
            esac
          done
          exit ${Status}
