name: Checks

on: [push, pull_request]

jobs:

  Job:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - name: OS packets
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            echo "deb https://mediaarea.net/repo/deb/ubuntu $(lsb_release --codename --short)-snapshots main" | sudo tee /etc/apt/sources.list.d/mediaarea-snapshots.list
            sudo curl https://repo.mediaarea.net/deb/ubuntu/keyring.gpg -o /etc/apt/trusted.gpg.d/mediaarea-snapshots.gpg
            sudo apt-get update
            sudo apt-get install -y nasm valgrind mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
            if grep -qw avx512f /proc/cpuinfo; then
              sudo apt-get install -y ffmpeg-ma # Latest snapshot
            else
              # FFmpeg 9.0.1, the 20260927 and 20261004 snapshots crash in the ffv1_vulkan encoder with llvmpipe on CPUs without AVX-512
              curl -fO https://mediaarea.net/download/binary/ffmpeg/9.0.1/ffmpeg-ma_9.0.1-1_amd64.Ubuntu_$(lsb_release --release --short).deb
              sudo apt-get install -y ./ffmpeg-ma_9.0.1-1_amd64.Ubuntu_$(lsb_release --release --short).deb
            fi
          fi
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew update
            brew install coreutils automake
          fi
      - name: FFmpeg
        run: |
          cd Project/GNU/CLI
          if [ "$RUNNER_OS" == "Linux" ]; then
            cp /usr/bin/ffmpeg-ma ffmpeg
          fi
          if [ "$RUNNER_OS" == "macOS" ]; then
            curl -O https://mediaarea.net/download/snapshots/binary/ffmpeg/latest/FFmpeg_Bin_Latest_Mac_Static_universal.zip 2>/dev/null
            7za e FFmpeg_Bin_Latest_Mac_Static_universal.zip bin/ffmpeg
          fi
      - name: Configure
        run: |
          cd Project/GNU/CLI
          sh autogen.sh
          ./configure
      - name: Compile
        run: |
          cd Project/GNU/CLI
          make
      - name: Check files
        run: |
          cd Project/GNU/CLI
          make clone_testing_files
      - name: Check
        run: |
          cd Project/GNU/CLI
          make check
